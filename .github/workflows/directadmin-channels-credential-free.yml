name: DirectAdmin Channels Credential-Free Verification

on:
  pull_request:
    paths:
      - "apps/directadmin/channels/**"
      - "apps/directadmin/server-node/directadmin-relay.mjs"
      - "apps/directadmin/server-node/directadmin-relay.test.mjs"
      - "apps/directadmin/server-node/images/directadmin-relay-client.mjs"
      - "packages/titan-platform/src/directadmin-channels.ts"
      - "packages/titan-platform/src/directadmin-cockpit.ts"
      - "packages/titan-platform/src/directadmin-plugin.ts"
      - "packages/titan-platform/tests/directadmin-channels.test.mjs"
      - "packages/titan-platform/tests/directadmin-bridge.test.mjs"
      - ".github/workflows/directadmin-channels-credential-free.yml"

permissions:
  contents: read

jobs:
  channels:
    name: Channels package, renderer, and relay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compile Channels contract
        run: |
          pnpm exec tsc packages/titan-platform/src/directadmin-channels.ts             --target ES2022 --module NodeNext --moduleResolution NodeNext             --strict --skipLibCheck --outDir packages/titan-platform/.test-dist
      - name: Run Channels role, package, and contract tests
        run: |
          node --test apps/directadmin/channels/tests/*.test.mjs             packages/titan-platform/tests/directadmin-channels.test.mjs
      - name: Build deterministic Channels archive
        run: |
          pnpm exec esbuild packages/titan-platform/src/directadmin-plugin.ts             --bundle --format=esm --platform=browser --target=es2022             --outfile="$RUNNER_TEMP/titan-directadmin-cockpit-sdk.mjs"
          node apps/directadmin/channels/tools/package.mjs             "$RUNNER_TEMP/titan-directadmin-cockpit-sdk.mjs"             "$RUNNER_TEMP/titan-channels-package"
          test -s "$RUNNER_TEMP/titan-channels-package/titan_channels.tar.gz"
          test -s "$RUNNER_TEMP/titan-channels-package/titan_channels.tar.gz.sha256"
      - name: Compile and run shared renderer regression
        run: |
          pnpm exec esbuild packages/titan-platform/src/directadmin-plugin.ts \
            --bundle --format=esm --platform=node --target=node22 \
            --outfile="$RUNNER_TEMP/titan-directadmin-sdk.mjs"
          TITAN_DIRECTADMIN_SDK="$RUNNER_TEMP/titan-directadmin-sdk.mjs" \
            node --test packages/titan-platform/tests/directadmin-channels-renderer.test.mjs
      - name: Run credential-free relay regressions
        run: |
          node --test apps/directadmin/server-node/directadmin-relay.test.mjs
