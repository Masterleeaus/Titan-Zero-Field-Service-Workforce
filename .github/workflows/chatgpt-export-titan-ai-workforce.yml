name: Export Titan AI Workforce Bundle
on:
  push:
    branches:
      - chatgpt/export-titan-ai-workforce

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Collect exact donor code
        shell: bash
        run: |
          set -euxo pipefail
          OUT=titan-ai-workforce-source
          mkdir -p "$OUT/services" "$OUT/apps/web/app/api/v1/titan" "$OUT/apps/web/app/api/v1/zero" "$OUT/apps/web/app/app/settings" "$OUT/apps/web/app" "$OUT/apps/web/lib" "$OUT/apps/web/components" "$OUT/packages/titan-platform/src/ported"

          cp -a services/workforce "$OUT/services/"
          cp -a workforce "$OUT/"
          cp -a apps/web/app/api/v1/titan/workforce "$OUT/apps/web/app/api/v1/titan/"
          cp -a apps/web/app/api/v1/zero/interactions "$OUT/apps/web/app/api/v1/zero/"
          cp -a apps/web/app/titan "$OUT/apps/web/app/"
          cp -a apps/web/lib/titan "$OUT/apps/web/lib/"
          cp -a packages/titan-platform/src/ported/titan-workforce "$OUT/packages/titan-platform/src/ported/"

          cp -a apps/web/app/app/ZeroChatFirst.tsx "$OUT/apps/web/app/app/"
          cp -a apps/web/app/app/settings/WorkforceHierarchyPanel.tsx "$OUT/apps/web/app/app/settings/"
          cp -a apps/web/app/app/settings/WorkforceLifecyclePanel.tsx "$OUT/apps/web/app/app/settings/"
          cp -a apps/web/app/app/settings/workforce-hierarchy-data.ts "$OUT/apps/web/app/app/settings/"
          cp -a apps/web/app/app/settings/workforce-lifecycle-data.ts "$OUT/apps/web/app/app/settings/"
          cp -a apps/web/components/AppShell.tsx "$OUT/apps/web/components/"
          cp -a apps/web/app/globals.css "$OUT/apps/web/app/"
          cp -a apps/web/app/layout.tsx "$OUT/apps/web/app/"

          printf '%s\n' \
            'Source: Masterleeaus/Titan-Zero-Field-Service-Workforce' \
            'Purpose: exact Titan AI Workforce donor-code export for AI-FSM integration.' \
            'Repository files are copied directly without rewriting.' \
            > "$OUT/SOURCE.txt"

          du -sh "$OUT"
          find "$OUT" -type f | wc -l
          find "$OUT" -type f -printf '%s %p\n' | sort -nr > workforce-file-sizes.txt
          sed -n '1,40p' workforce-file-sizes.txt

      - name: Upload exact source bundle
        uses: actions/upload-artifact@v4
        with:
          name: titan-ai-workforce-source
          path: titan-ai-workforce-source
          compression-level: 0
          retention-days: 7
