name: Require actionable issue task checklists

on:
  issues:
    types: [opened, edited, reopened, closed]
  push:
    paths:
      - '.github/workflows/issue-checklist-standard.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-checklists-repo
  cancel-in-progress: false

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - name: Backfill open-issue tasks and reopen incomplete closures
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const taskRe = /^\s*(?:[-*+]|\d+[.)])\s+\[([ xX])\]\s+\S/gm;
            const hasTasks = body => [...(body || '').matchAll(taskRe)];
            const actionWord = /^(add|align|audit|build|check|configure|connect|create|define|deliver|design|document|enforce|ensure|fix|implement|integrate|map|migrate|move|preserve|prevent|publish|reconcile|refactor|remove|replace|require|resolve|restore|review|run|secure|test|update|validate|verify|wire)\b/i;
            const inScope = /scope|deliver|implementation|plan|task|step|requirement|fix|suggest|accept|done|feature|security|work|problem/i;

            function derive(issue) {
              const subtasks = [];
              let section = '', code = false;
              for (const raw of (issue.body || '').split(/\r?\n/)) {
                const line = raw.trim();
                if (/^(?:\x60{3}|~{3})/.test(line)) { code = !code; continue; }
                if (code) continue;
                if (/^#{1,5}\s/.test(line)) { section = line.replace(/^#{1,5}\s+/, ''); continue; }
                if (!inScope.test(section)) continue;
                const item = line.match(/^(?:[-*+]|\d+[.)])\s+(.+)/);
                if (!item || /^\[[ xX]\]\s/.test(item[1])) continue;
                let text = item[1].replace(/\[([^\]]+)\]\([^)]+\)/g, '$1').replace(/\*\*/g, '').trim();
                if (text.length < 20 || /^(?:https?:|see also|parent:|generated by)/i.test(text)) continue;
                if (text.length > 230) text = text.slice(0, 227).replace(/\s+\S*$/, '') + '...';
                if (!actionWord.test(text)) text = 'Implement and verify: ' + text;
                if (!subtasks.includes(text)) subtasks.push(text);
                if (subtasks.length >= 6) break;
              }
              if (subtasks.length === 0) subtasks.push('Reproduce or verify the reported problem and identify affected source paths: ' + issue.title);
              if (subtasks.length === 1) subtasks.push('Implement the change in the canonical repository, preserving compatible existing functionality');
              subtasks.push('Add and run focused regression, failure-path and security/tenant tests as applicable');
              subtasks.push('Run appropriate CI and acceptance checks, attach code/PR links and record actual results before closure');
              return subtasks.map(task => '- [ ] ' + task).join('\n');
            }

            async function inspect(issue) {
              if (!issue || issue.pull_request) return;
              const { data: latest } = await github.rest.issues.get({ owner, repo, issue_number: issue.number });
              if (latest.pull_request) return;
              const tasks = hasTasks(latest.body);
              if (latest.state === 'closed') {
                if (tasks.length === 0 || tasks.some(m => m[1].toLowerCase() !== 'x')) {
                  await github.rest.issues.update({ owner, repo, issue_number: latest.number, state: 'open' });
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: latest.number,
                    body: 'Reopened automatically: each issue must have actionable tasks and every checkbox must be checked with verifiable completion evidence before closure.'
                  });
                  core.setFailed('Incomplete issue closure: #' + latest.number);
                }
                return;
              }
              if (tasks.length > 0) return;
              const body = (latest.body || '').trimEnd() +
                '\n\n## Required implementation checklist\n' +
                '<!-- issue-checklist-standard: extracted from the existing scope; refine before implementation -->\n' +
                derive(latest) + '\n\nDo not check a task without implementation and test evidence. All tasks must be checked before closing.\n';
              await github.rest.issues.update({ owner, repo, issue_number: latest.number, body });
              core.notice('Added task checklist to #' + latest.number);
            }

            if (context.eventName === 'issues') {
              await inspect(context.payload.issue);
            } else {
              const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 });
              for (const issue of issues) await inspect(issue);
              core.notice('Audited ' + issues.filter(i => !i.pull_request).length + ' open issues');
            }