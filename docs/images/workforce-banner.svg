<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Titan Zero Field Service Workforce</title>
  <desc id="desc">An emerald and amber field-service operating loop connecting office, field, customer, systems, and governed workforce coordination.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1a1d"/><stop offset="1" stop-color="#12645f"/></linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8ce7bd"/><stop offset="1" stop-color="#f5c16f"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".06"/></pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#f5c16f"/></marker>
    <style>
      .title{font:700 39px Segoe UI,Arial,sans-serif;fill:#f6fbf8}.sub{font:600 15px Segoe UI,Arial,sans-serif;letter-spacing:2.3px;fill:#d9f4e5}.eyebrow{font:700 12px Segoe UI,Arial,sans-serif;letter-spacing:2.5px;fill:#93edc0}.label{font:700 12px Segoe UI,Arial,sans-serif;fill:#f5fbf7}.tiny{font:400 11px Segoe UI,Arial,sans-serif;fill:#bad9cf}
    </style>
  </defs>
  <rect width="1200" height="360" rx="22" fill="url(#bg)"/><rect width="1200" height="360" rx="22" fill="url(#grid)"/>
  <circle cx="1110" cy="45" r="220" fill="#f5c16f" opacity=".10"/><circle cx="95" cy="395" r="220" fill="#66e7bb" opacity=".12"/>
  <text x="70" y="66" class="eyebrow">TITAN ZERO � FIELD SERVICE � TYPESCRIPT MONOREPO</text>
  <text x="70" y="125" class="title">Titan Zero Field Service Workforce</text>
  <text x="72" y="160" class="sub">OFFICE    FIELD    CUSTOMER    SYSTEMS  �  GOVERNED WORK</text>
  <path d="M120 246H1080" stroke="#4b8e81" stroke-width="2"/><path d="M132 246H1050" stroke="url(#route)" stroke-width="3" marker-end="url(#arrow)"/>
  <g>
    <circle cx="132" cy="246" r="25" fill="#1a5b58" stroke="#91e9be" stroke-width="2"/><text x="132" y="251" text-anchor="middle" class="label">01</text><text x="132" y="292" text-anchor="middle" class="label">Context</text><text x="132" y="312" text-anchor="middle" class="tiny">interaction + signal</text>
    <circle cx="371" cy="246" r="25" fill="#1a5b58" stroke="#91e9be" stroke-width="2"/><text x="371" y="251" text-anchor="middle" class="label">02</text><text x="371" y="292" text-anchor="middle" class="label">Decision</text><text x="371" y="312" text-anchor="middle" class="tiny">evidence + policy</text>
    <circle cx="610" cy="246" r="25" fill="#1a5b58" stroke="#91e9be" stroke-width="2"/><text x="610" y="251" text-anchor="middle" class="label">03</text><text x="610" y="292" text-anchor="middle" class="label">Authority</text><text x="610" y="312" text-anchor="middle" class="tiny">risk + approval</text>
    <circle cx="849" cy="246" r="25" fill="#1a5b58" stroke="#91e9be" stroke-width="2"/><text x="849" y="251" text-anchor="middle" class="label">04</text><text x="849" y="292" text-anchor="middle" class="label">Workforce</text><text x="849" y="312" text-anchor="middle" class="tiny">Nexus + tools</text>
    <circle cx="1088" cy="246" r="25" fill="#57452a" stroke="#f5c16f" stroke-width="2"/><text x="1088" y="251" text-anchor="middle" class="label">05</text><text x="1088" y="292" text-anchor="middle" class="label">Evidence</text><text x="1088" y="312" text-anchor="middle" class="tiny">state + outcomes</text>
  </g>
  <text x="70" y="342" class="tiny">company_id boundary � reversible actions � offline-capable operations</text>
</svg>

